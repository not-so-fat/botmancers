# Releases botmancers to npm from a v<version> tag pushed by
# `npm run release:finish`. Job check runs the release gate (version,
# changelog, app build, tests, package contents, canary installs of the exact
# tarball); job publish then publishes packages/mcp-server with npm trusted
# publishing (OIDC, no credential) and creates the GitHub Release from the
# CHANGELOG entry. `npm run publish:packages` stays as the documented manual
# fallback (docs/PUBLISHING.md).
name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the app's locked dependencies (repository root)
        # The package bundles the Next.js app built from the repository root
        # (scripts/build-app.mjs), so its exact package-lock.json is installed too.
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Install the locked package-local build tools
        # npm ci installs exactly packages/mcp-server/package-lock.json (and
        # fails if it disagrees with package.json), so the tagged commit always
        # compiles with the same TypeScript and @types/node as its dry run.
        run: npm ci --no-audit --no-fund
      - name: Release check (version, changelog, clean tree, app build, tests, contents, canary installs)
        # The canary installs run the exact tarball through three smokes before
        # anything is published: bridge-only, the unified product, and the
        # managed install (scripts/install.sh -> ~/.botmancers/versions, the
        # ~/.local/bin launcher, background staging of N+1, activation at one
        # restart, rollback). A tarball missing the launcher/updater code, the
        # UI/core runtime, the bridge, or the native SQLite driver fails here.
        run: npm run build && npm run build:app && npm run release:check -- --tag "$GITHUB_REF_NAME"
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    environment: npm
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure npm supports trusted publishing
        # Trusted publishing needs npm 11.5.1 or newer (Node 24 ships one);
        # upgrade only when the runner is older.
        run: |
          if [ "$(printf '%s\n%s\n' "$(npm --version)" '11.5.1' | sort -V | head -n 1)" = '11.5.1' ]; then
            echo "npm $(npm --version) supports trusted publishing"
          else
            npm install -g npm@11
          fi
      - name: Install the app's locked dependencies (repository root)
        # Same as check: the package bundles the Next.js app built from the
        # repository root, so the tarball is built from the tagged commit.
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Install the locked package-local build tools
        run: npm ci --no-audit --no-fund
      - name: Build the tarball from the tagged commit
        run: npm run build && npm run build:app
      - name: Publish botmancers to npm and create the GitHub Release
        # No credential is configured: npm exchanges the job's OIDC identity
        # for a short-lived publish grant. Already on npm -> skip the publish
        # but still ensure the GitHub Release exists, so a re-run finishes
        # cleanly; any other registry error fails closed. GH_TOKEN (the job's
        # own GITHUB_TOKEN, contents: write) lets gh create the GitHub Release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish-ci.mjs --tag "$GITHUB_REF_NAME"
