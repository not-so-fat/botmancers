# Publishes the botmancers npm package (packages/mcp-server) with provenance
# when an operator pushes a botmancers-v<version> tag. It always publishes to
# the "canary" dist-tag. Promotion to "latest" is a separate operator step,
# taken after the registry smoke passes (see packages/mcp-server/RELEASING.md).
name: release-botmancers

on:
  push:
    tags:
      - 'botmancers-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # npm provenance / trusted publishing (OIDC)
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm trusted publishing (OIDC) needs Node >= 22.14 and npm >= 11.5.1.
          # Node 24 bundles npm 11; the next step enforces the npm floor anyway.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install -g npm@11.6.2
          fi
          npm --version
      - name: Install the locked package-local build tools
        # npm ci installs exactly packages/mcp-server/package-lock.json (and
        # fails if it disagrees with package.json), so the tagged commit always
        # compiles with the same TypeScript and @types/node as its dry run.
        run: npm ci --no-audit --no-fund
      - name: Release check (version, changelog, clean tree, tests, contents, provenance, canary install)
        run: npm run build && npm run release:check -- --tag "$GITHUB_REF_NAME"
      - name: Publish to the canary dist-tag with provenance
        # Trusted publishing (OIDC) when configured on npmjs.com with the direct
        # "npm publish" action allowed; otherwise (first publish only) the
        # short-lived, bypass-2FA granular NPM_TOKEN environment secret is used.
        run: npm publish --provenance --access public --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
