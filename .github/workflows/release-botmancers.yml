# Publishes the botmancers npm package (packages/mcp-server) with provenance
# when an operator pushes a botmancers-v<version> tag. It always publishes to
# the "canary" dist-tag. Promotion to "latest" is a separate operator step,
# taken after the registry smoke passes (see packages/mcp-server/RELEASING.md).
name: release-botmancers

on:
  push:
    tags:
      - 'botmancers-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # npm provenance / trusted publishing (OIDC)
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm trusted publishing (OIDC) needs Node >= 22.14 and npm >= 11.5.1.
          # Node 24 bundles npm 11; the next step enforces the npm floor anyway.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install -g npm@11.6.2
          fi
          npm --version
      - name: Install the app's locked dependencies (repository root)
        # The package bundles the Next.js app built from the repository root
        # (scripts/build-app.mjs), so its exact package-lock.json is installed too.
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Install the locked package-local build tools
        # npm ci installs exactly packages/mcp-server/package-lock.json (and
        # fails if it disagrees with package.json), so the tagged commit always
        # compiles with the same TypeScript and @types/node as its dry run.
        run: npm ci --no-audit --no-fund
      - name: Release check (version, changelog, clean tree, app build, tests, contents, provenance, canary installs)
        # The canary installs run the exact tarball through three smokes before
        # anything is published: bridge-only, the unified product, and the
        # managed install (scripts/install.sh -> ~/.botmancers/versions, the
        # ~/.local/bin launcher, background staging of N+1, activation at one
        # restart, rollback). A tarball missing the launcher/updater code, the
        # UI/core runtime, the bridge, or the native SQLite driver fails here.
        run: npm run build && npm run build:app && npm run release:check -- --tag "$GITHUB_REF_NAME"
      - name: Publish to the canary dist-tag with provenance
        # scripts/publish-ci.sh runs `npm publish --provenance --access public
        # --tag canary`. With the NPM_TOKEN environment secret present (first
        # publish, or rollback while trusted publishing is unproven) it exports
        # it as NODE_AUTH_TOKEN. Without it, it unsets NODE_AUTH_TOKEN and strips
        # setup-node's _authToken npmrc entry so npm uses trusted publishing
        # (OIDC); an empty token would suppress the OIDC exchange.
        # NODE_AUTH_TOKEN is deliberately not set here.
        run: bash scripts/publish-ci.sh
        env:
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
