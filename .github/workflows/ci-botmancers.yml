# Runs the same release gate as release-botmancers.yml on every pull request
# that touches the app or the package, on the release runner (Linux, Node 24),
# so a failure shows up before a tag is pushed. It never publishes.
name: ci-botmancers

on:
  pull_request:
    paths:
      - 'packages/mcp-server/**'
      - 'app/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'test-*.js'
      - 'test-support/**'
      - 'docs/contracts/**'
      - 'docs/evidence/NOT-514/**'
      - 'scripts/not-514-*'
      - '.github/workflows/*botmancers.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the app's locked dependencies (repository root)
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Install the locked package-local build tools
        run: npm ci --no-audit --no-fund
      - name: Focused Agent registration/migration suites (NOT-502)
        working-directory: .
        run: |
          npm run test:agent-registration
          npm run test:agent-registration-ui
          npm run test:bot-definition
      - name: Focused session provider/catalog suites (NOT-503)
        working-directory: .
        run: |
          npm run test:session-provider
          npm run test:muse-session-provider
          npm run test:session-catalog
          npm run test:engine-store
          npm run test:service-grants
          npm run test:mcp-bridge
      - name: Focused Claude provider and Agent Deck compatibility suites (NOT-506)
        working-directory: .
        run: |
          npm run test:claude-session-provider
          npm run test:agent-deck-run
          npm run test:agent-deck-finalization
          npm run test:agent-deck-settings
      - name: Focused Cursor and direct Codex providers and Agent Deck compatibility suites (NOT-505, NOT-504)
        working-directory: .
        run: |
          npm run test:cursor-session-provider
          npm run test:codex-session-provider
          npm run test:agent-deck-run
          npm run test:agent-deck-finalization
          npm run test:agent-deck-settings
      - name: Focused session usage suites (NOT-509)
        working-directory: .
        run: |
          npm run test:session-usage
      - name: Focused session pin, service-grant, MCP, exchange, and skill suites (NOT-507)
        working-directory: .
        run: |
          npm run test:session-pins
          npm run test:service-grants
          npm run test:mcp-bridge
          npm run test:agent-exchanges
          npm run test:exchange-ui
          npm run test:session-catalog
          npm --prefix packages/mcp-server run check:skill
      - name: Session share preflight fixtures (NOT-514)
        working-directory: .
        run: |
          npm run test:session-share-preflight
      - name: Focused SessionShare core, service-grant, session-pin, and MCP suites (NOT-515)
        working-directory: .
        run: |
          npm run test:session-shares
          npm run test:service-grants
          npm run test:session-pins
          npm run test:mcp-bridge
      - name: Slack relay core with the real SessionShare store (NOT-516)
        working-directory: .
        run: |
          npm run test:slack-relay
      - name: Release check (dry run, no registry mutation)
        run: |
          npm run build && npm run build:app
          npm run release:check -- --out "$RUNNER_TEMP/release-check.log" || status=$?
          echo "release:check exit=${status:-0}"
          exit "${status:-0}"
      - name: Release-check transcript
        if: always()
        run: cut -c1-300 "$RUNNER_TEMP/release-check.log" || true
