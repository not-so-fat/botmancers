# Runs the same release gate as release.yml on every pull request
# that touches the app or the package, on the release runner (Linux, Node 24),
# so a failure shows up before a tag is pushed. It never publishes.
name: ci

on:
  pull_request:
    paths:
      - 'packages/mcp-server/**'
      - 'app/**'
      - 'lib/**'
      - 'public/**'
      - 'proxy.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - 'docs/contracts/**'
      - 'tests/fixtures/session-share-preflight/**'
      - 'scripts/not-514-*'
      - 'scripts/slack-relay-smoke.js'
      - 'instrumentation.ts'
      - 'next.config.ts'
      - '.github/workflows/*.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the app's locked dependencies (repository root)
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Install the locked package-local build tools
        run: npm ci --no-audit --no-fund
      - name: Root deterministic suites (npm test)
        # Every suite the old hand-selected steps ran is in `npm test`
        # (tests/run.js runs all tests/test-*.js except the documented
        # live/manual exclusions), plus the rest of the deterministic
        # suites. The package skill check keeps its own step below.
        working-directory: .
        run: npm test
      - name: Package skill check
        working-directory: .
        run: npm --prefix packages/mcp-server run check:skill
      - name: Release check (dry run, no registry mutation)
        run: |
          npm run build && npm run build:app
          npm run release:check -- --out "$RUNNER_TEMP/release-check.log" || status=$?
          echo "release:check exit=${status:-0}"
          exit "${status:-0}"
      - name: Release-check transcript
        if: always()
        run: cut -c1-300 "$RUNNER_TEMP/release-check.log" || true
